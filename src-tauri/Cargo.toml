[package]
name = "postmortem"
version = "0.1.7"
description = "Review your Lichess games with Stockfish and a rule-based coach"
authors = ["event173"]
license = "GPL-3.0-or-later"
repository = "https://github.com/event173/postmortem"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "postmortem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "query", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
zstd = "0.14.3"
fastrand = "2.5.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"
