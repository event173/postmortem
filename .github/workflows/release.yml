# Builds installers for Windows and Linux when a version tag is pushed
# (e.g. `git tag v0.2.0 && git push origin v0.2.0`) and attaches them to a
# draft GitHub release. Stockfish 19 (official build, GPL-3.0) is bundled.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            stockfish: stockfish-windows-x86-64-universal.zip
          # Older Ubuntu = older glibc = runs on more distributions.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            stockfish: stockfish-linux-x86-64-universal.tar.gz
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Fetch Stockfish
        shell: bash
        run: |
          mkdir -p src-tauri/binaries sf
          curl -fsSL --retry 5 -o "sf/${{ matrix.stockfish }}" \
            "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/${{ matrix.stockfish }}"
          cd sf
          case "${{ matrix.stockfish }}" in
            *.zip) unzip -q "${{ matrix.stockfish }}" || 7z x "${{ matrix.stockfish }}" ;;
            *) tar xzf "${{ matrix.stockfish }}" ;;
          esac
          exe=$(find . -type f -name 'stockfish-*-universal*' ! -name '*.zip' ! -name '*.tar.gz' | head -1)
          test -n "$exe"
          ext=""; case "$exe" in *.exe) ext=".exe" ;; esac
          cp "$exe" "../src-tauri/binaries/stockfish-${{ matrix.target }}$ext"
          ls -la ../src-tauri/binaries

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: postmortem ${{ github.ref_name }}
          releaseBody: |
            **Windows:** Installer (`.exe` oder `.msi`) herunterladen und ausführen. Beim ersten Start
            zeigt Windows evtl. „Unbekannter Herausgeber“ – „Weitere Informationen“ → „Trotzdem ausführen“.

            **Linux:**
            - **Flatpak** (empfohlen, läuft auf jeder Distribution, alles enthalten):
              `flatpak install --user postmortem_*.flatpak` – oder per Doppelklick im Software-Center
            - `.deb` (Debian/Ubuntu/Mint): `sudo apt install ./postmortem_*_amd64.deb`
            - `.AppImage`: ausführbar machen (`chmod +x`) und starten

            Stockfish 19 ist überall enthalten.
          releaseDraft: true
          args: --config src-tauri/tauri.release.conf.json

      - name: Keep the Linux binary for the Flatpak job
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: src-tauri/target/release/postmortem
          retention-days: 1

  # Single-file Flatpak bundle (GNOME 51 runtime, Stockfish built from source),
  # built in Flathub's official container (privileged, so the builder's sandbox works).
  flatpak:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: src-tauri/target/release

      - run: chmod +x src-tauri/target/release/postmortem

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: postmortem_x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.event173.postmortem.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: postmortem_x86_64.flatpak
          retention-days: 1

  # Attach the bundle to the draft release (the gh CLI is available on GitHub's runners).
  attach-flatpak:
    needs: flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv postmortem_x86_64.flatpak "postmortem_${GITHUB_REF_NAME#v}_x86_64.flatpak"
          gh release upload "$GITHUB_REF_NAME" postmortem_*_x86_64.flatpak --clobber --repo "$GITHUB_REPOSITORY"
